name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main # Change this if your default branch is 'master'
  workflow_dispatch: # Allows you to trigger it manually from the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest # This server is natively linux/amd64!

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Free up disk space (Optional but recommended for large ML builds)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: vm150123045/cold-storage-logistics:vAzure2
